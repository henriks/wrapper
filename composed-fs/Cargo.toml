[package]
name = "agentvm-composed-fs"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vhost = "0.13.0"
vhost-user-backend = "0.17.0"
virtiofsd = { version = "1.13.3", default-features = false }
vm-memory = { version = "0.16.0", features = ["backend-mmap", "backend-atomic"] }
