[package]
name = "agentvm-composed-fs"
version = "0.1.0"
edition = "2021"
publish = false

[features]
fuzzing = []

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23.0"
vhost = "0.13.0"
vhost-user-backend = "0.17.0"
virtiofsd = { path = "../third_party/virtiofsd", default-features = false }
vm-memory = { version = "0.16.0", features = ["backend-mmap", "backend-atomic"] }

[dev-dependencies]
proptest = "1.11.0"
