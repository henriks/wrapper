[package]
name = "agentvm-frontend-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
agentvm-composed-fs = { path = "../../composed-fs", features = ["fuzzing"] }
agentvm-frontend = { path = ".." }
agentvm-payload-protocol = { path = "../../payload-protocol" }
hickory-proto = "0.26.1"
libfuzzer-sys = "0.4"
smoltcp = { version = "0.13.1", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp"] }

[[bin]]
name = "vmnet_stream_frame_io"
path = "fuzz_targets/vmnet_stream_frame_io.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_proxy_payload"
path = "fuzz_targets/dns_proxy_payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vmnet_gateway_frame"
path = "fuzz_targets/vmnet_gateway_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "payload_protocol_frame"
path = "fuzz_targets/payload_protocol_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "supervisor_control_message"
path = "fuzz_targets/supervisor_control_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "composed_manifest_shape"
path = "fuzz_targets/composed_manifest_shape.rs"
test = false
doc = false
bench = false

[[bin]]
name = "composed_fs_ops"
path = "fuzz_targets/composed_fs_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "composed_fs_locks"
path = "fuzz_targets/composed_fs_locks.rs"
test = false
