[package]
name = "agentvm-frontend"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "agentvm"

[[bin]]
name = "agentvm"
path = "src/main.rs"

[[bin]]
name = "agentvm-frontend"
path = "src/main.rs"

[dependencies]
agentvm-composed-fs = { path = "../composed-fs" }
crossterm = "0.29.0"
hickory-proto = "0.26.1"
httparse = "1.10.1"
ipnet = "2.12.0"
libc = "0.2.177"
ratatui = "0.30.0"
rcgen = { version = "0.14.8", features = ["x509-parser"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.3"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
smoltcp = { version = "0.13.1", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp"] }
tui-term = "0.3.4"
vt100 = "0.16.2"

[dev-dependencies]
proptest = "1.11.0"
