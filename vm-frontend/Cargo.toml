[package]
name = "agentvm-frontend"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "agentvm"

[features]
validation-self-test = []

[[bin]]
name = "agentvm"
path = "src/bin/agentvm.rs"

[[bin]]
name = "agentvm-frontend"
path = "src/bin/agentvm_frontend.rs"

[[bin]]
name = "agentvm-self-test"
path = "src/bin/agentvm_self_test.rs"
required-features = ["validation-self-test"]

[dependencies]
agentvm-composed-fs.workspace = true
agentvm-payload-protocol.workspace = true
clap.workspace = true
crossterm = "0.29.0"
fs4 = "1.1.0"
hickory-proto = "0.26.1"
httparse = "1.10.1"
ipnet = "2.12.0"
libc.workspace = true
mio = { version = "1.2.0", features = ["net", "os-ext", "os-poll"] }
pcap-file = "2.0.0"
ratatui = "0.30.0"
rcgen = { version = "0.14.8", features = ["x509-parser"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.3"
rustls-pemfile = "2.2.0"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
shlex = "1.3.0"
smoltcp = { version = "0.13.1", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp"] }
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tui-input = "0.15.3"
tui-term = "0.3.4"
unicode-width = "0.2.2"
vt100 = "0.16.2"
wait-timeout = "0.2.1"

[dev-dependencies]
proptest.workspace = true
