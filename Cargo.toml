[workspace]
members = [
    "composed-fs",
    "guest-service",
    "payload-protocol",
    "third_party/virtiofsd",
    "vm-frontend",
]
exclude = ["vm-frontend/fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
agentvm-composed-fs = { path = "composed-fs" }
agentvm-payload-protocol = { path = "payload-protocol" }
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.177"
proptest = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.23.0"
thiserror = "2.0.17"
tracing = "0.1.44"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time", "io-util", "io-std", "fs"] }
vhost = "0.13.0"
vhost-user-backend = "0.17.0"
virtiofsd = { path = "third_party/virtiofsd", default-features = false }
vm-memory = { version = "0.16.0", features = ["backend-mmap", "backend-atomic"] }
